<body>

    <div class="room-scale">

        <!-- Shelf (NOT interactive) -->
        <img src="assets/images/shelf.png" class="item shelf">

        <!-- Couch -->
        <a href="market.html"><img src="assets/images/couch.png" class="item couch interactive"></a>

        <!-- Monstera -->
        <a href="monstera.html"><img src="assets/images/Monstera.png" class="item monstera interactive"></a>

        <!-- Leopard -->
        <a href="lepord.html"><img src="assets/images/lepord.png" class="item leopard interactive"></a>

        <!-- Table (NOT animated) -->

        <!-- Flowers -->
        <a href="flower.html"><img src="assets/images/flowers.png" class="item flowers interactive"></a>

        <!-- Taxidermy Jars -->
        <a href="taxidermy.html"><img src="assets/images/taxidermy.png" class="item jars interactive"></a>

        <!-- Coat Rack -->

        <!-- Simmer Pot -->
        <a href="simmer.html"><img src="assets/images/simmerpot.png" class="item simmer interactive"></a>

        <!-- 🎵 Record Player with Music Notes -->

        <a href="record.html">
            <img src="assets/images/record.png" class="item interactive">
        </a>
        <audio controls class="audiobar">
            <source src="assets/audio/home.mp3" type="audio/mpeg">
        </audio>

        <span class="note note2">♫</span>

            <img src="assets/images/coffee.png" class="item interactive">
        </a>
        <span class="steam steam1"></span>
        <span class="steam steam2"></span>
        <span class="steam steam3"></span>
    </div>

    <div class="floor"></div>

</div>
<!-- Pixel Guide Navigation -->
